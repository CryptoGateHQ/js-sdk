name: Generate SDK
on:
  workflow_dispatch: {}
  push:
    paths: ['openapi.yaml', 'openapitools.json', '.github/workflows/generate.yml']
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate (typescript-axios)
        run: |
          docker run --rm -v "${{ github.workspace }}:/local" \
            openapitools/openapi-generator-cli:v7.10.0 \
            generate -i /local/openapi.yaml -g typescript-axios -o /local \
            --skip-validate-spec \
            --additional-properties=npmName=@cryptogatehq/js-sdk,npmVersion=0.1.0,supportsES6=true,useSingleRequestParameter=true
      - name: Commit regenerated SDK
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: regenerate SDK from openapi.yaml"
          git push
