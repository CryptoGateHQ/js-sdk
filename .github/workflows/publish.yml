name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write          # npm Trusted Publishing (OIDC) + automatic provenance — no token
jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest     # Trusted Publishing requires npm >= 11.5.1
      - run: npm ci || npm install
      - run: npm publish --access public   # OIDC trusted publishing — no token; provenance is automatic
